baseURL = "https://standpointlabs.com/"
locale = "en-us"
title = "Standpoint Labs"
theme = "congo"
buildFuture = true
copyright = "© 2026 Standpoint Labs LLC · [Privacy Policy](/privacy/) · [RSS](/index.xml)"

[params]
  colorScheme = "standpoint"
  defaultAppearance = "light"
  autoSwitchAppearance = false
  defaultThemeColor = "#FAFAFA"
  enableSearch = false
  enableCodeCopy = true
  description = "The relational layer for connected sovereignty"
  keywords = ["relational infrastructure", "connected sovereignty", "sovereign AI", "self-hosted agents", "agent alignment", "AI agents", "perspective-aware AI", "AI coordination", "context graphs", "community intelligence", "multi-agent systems", "relational core", "relational intelligence", "DI mesh", "standpoint core", "standpoint mesh", "Digital Intelligence", "fifth story"]

  [params.defaultImage]
    src = "og-image.png"

  [params.header]
    layout = "basic"
    showTitle = true

  [params.footer]
    showCopyright = true
    showThemeAttribution = false
    showAppearanceSwitcher = false
    showScrollToTop = true

  [params.homepage]
    layout = "custom"
    showRecent = false

  [params.article]
    showDate = true
    showAuthor = false
    showBreadcrumbs = false
    showTableOfContents = false
    showWordCount = false
    showReadingTime = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false

[taxonomies]
  tag = "tags"
