{{/* spl2-picture: an asset image as WebP at two widths with a JPEG fallback. Params: src alt sizes class */}}
{{ with resources.Get .src }}
{{ $w800 := .Resize "800x webp q80" }}{{ $w1600 := .Resize "1600x webp q78" }}{{ $j := .Resize "1600x jpg q80" }}
<picture>
  <source type="image/webp" srcset="{{ $w800.RelPermalink }} 800w, {{ $w1600.RelPermalink }} 1600w" sizes="{{ $.sizes | default "(max-width: 860px) 100vw, 560px" }}">
  <img src="{{ $j.RelPermalink }}" alt="{{ $.alt }}" width="{{ $j.Width }}" height="{{ $j.Height }}"{{ if $.eager }} fetchpriority="high"{{ else }} loading="lazy" decoding="async"{{ end }}{{ with $.class }} class="{{ . }}"{{ end }}>
</picture>
{{ end }}
